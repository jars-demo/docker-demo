[project]
name = "docker-lab"
version = "0.1.0"
description = "Docker, from first container to production: twelve exercises on real Docker."
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"exercises/**" = ["E402"]
"solutions/**" = ["E402"]

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Ask over TCP, the way the API connects. During the first start Postgres runs a
      # temporary server on its Unix socket only, so a socket check passes too early.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "app"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    ports:
      - "127.0.0.1::8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    ports:
      - "127.0.0.1::8000"
    depends_on:
      - db

volumes:
  pgdata:
